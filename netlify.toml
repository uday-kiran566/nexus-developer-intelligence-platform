[build]
  command = "cd Frontend && npm ci && npm run build"
  publish = "Frontend/dist"

[functions]
  directory = "Backend/netlify/functions"
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
